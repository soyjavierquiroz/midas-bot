version: '3.8'

services:
  midas-bot:
    image: midas-bot:latest
    working_dir: /opt/projects/midas-bot
    volumes:
      - /opt/projects/midas-bot:/opt/projects/midas-bot
    command: npm start
    ports:
      - "3000:3000"
    environment:
      MINIO_ENDPOINT: https://kminioback.kurukin.com
      MINIO_ACCESS_KEY: kc9A2XrJOBVSK5diJN8X
      MINIO_SECRET_KEY: x3mrAdZhvHd4a1nKift1vJdswvGnf8ltHqw3YUy1
      MINIO_REGION: us-east-1
      MINIO_FORCE_PATH_STYLE: "true"
      DB_HOST: wordpress_db
      DB_USER: bot_kurukin_user
      DB_PASSWORD: cdfedf0ae18a2b08cdd180823fad884d
      DB_NAME: bot_kurukin_wp
    labels:
      - traefik.enable=true
      - traefik.http.routers.kurukinmidas.rule=Host(`midas.kurukin.com`)
      - traefik.http.routers.kurukinmidas.entrypoints=websecure
      - traefik.http.routers.kurukinmidas.tls.certresolver=le
      - traefik.http.routers.kurukinmidas.tls=true
      - traefik.http.services.kurukinmidas.loadbalancer.server.port=3000
    networks:
      - general_network
      - traefik_public

networks:
  general_network:
    external: true
  traefik_public:
    external: true
